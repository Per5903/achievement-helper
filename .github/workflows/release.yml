name: Release

# Push a tag like v0.1.0 (matching "version" in gradle.properties) to build and publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      - name: Read version
        id: meta
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "${version%%+*}" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in gradle.properties" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mc=$mc" >> "$GITHUB_OUTPUT"
          # Release notes: the CHANGELOG.md section of this version
          awk -v v="$tag" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md

      - name: Build and run unit tests
        run: ./gradlew build

      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Achievement Helper ${{ steps.meta.outputs.version }}
          body_path: notes.md
          files: build/libs/achievehelper-${{ steps.meta.outputs.version }}.jar

      # Runs once the MODRINTH_TOKEN secret and MODRINTH_PROJECT_ID variable are set in the repo settings.
      - name: Modrinth
        if: env.MODRINTH_TOKEN != '' && env.MODRINTH_PROJECT_ID != ''
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: build/libs/achievehelper-${{ steps.meta.outputs.version }}.jar
          name: Achievement Helper ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: beta
          changelog-file: notes.md
          loaders: fabric
          game-versions: ${{ steps.meta.outputs.mc }}
          environment: client
          java: 25
          dependencies: |
            fabric-api(required)
            modmenu(optional)
